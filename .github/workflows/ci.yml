name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests migrations
      # Required suite (TDD s11): project-scoped authorization, enforced at the API layer.
      - name: Authorization
        run: python -m pytest tests/test_authorization.py -q
      - name: Everything else
        run: python -m pytest tests -q

  migrations-postgres:
    # SQLite is exercised by the test suite; production runs on PostgreSQL, so the migration
    # has to round-trip there too.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftleft
          POSTGRES_PASSWORD: shiftleft
          POSTGRES_DB: shiftleft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shiftleft" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      SHIFTLEFT_DATABASE_URL: postgresql+asyncpg://shiftleft:shiftleft@localhost:5432/shiftleft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shiftleft-backend:ci backend
      - run: docker build -t shiftleft-frontend:ci frontend
