# Included in every location that sets headers: nginx drops inherited add_header directives as
# soon as a location declares one of its own, so they are repeated by inclusion, not by copy.
#
# 'unsafe-inline' for styles only: Angular injects component styles as <style> elements.
# Scripts stay 'self' - the production build emits no inline script or handler.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
