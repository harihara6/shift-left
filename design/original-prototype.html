<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>

    --panel-2: #242424;
    --border: #2e2e2e;
    --border-2: #3a3a3a;
    --text: #e8e8e8;
    --text-2: #a8a8a8;
    --text-3: #7d7d7d;
    --accent: #2f81f7;
    --good: #3fb950;
    --watch: #d29922;
    --poor: #f85149;
    --info: #4d9cf6;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --chrome: #f7f7f7;
      --panel: #fbfbfb;
      --panel-2: #f2f2f2;
      --border: #e3e3e3;
      --border-2: #d5d5d5;
      --text: #1c1c1c;
      --text-2: #5b5b5b;
      --text-3: #858585;
      --accent: #0b62d6;
      --good: #1a7f37;
      --watch: #9a6700;
      --poor: #cf222e;
      --info: #0b62d6;
    }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 20px;
  }
  header.app {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    background: var(--chrome); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;

  .wordmark { font-weight: 700; letter-spacing: 1.1px; }
  .tagline { color: var(--text-3); font-size: 12px; }
  .user { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border-2);
    border-radius: 999px; padding: 3px 10px; color: var(--text); font-size: 12px;
  }
  .shell { display: flex; align-items: stretch; min-height: calc(100vh - 53px); }
  nav.side {
    width: 230px; flex-shrink: 0; padding: 12px;
    border-right: 1px solid var(--border); background: var(--bg);
  }
  nav.side .group { color: var(--text-3); font-size: 12px; margin: 14px 0 6px; }
  nav.side button {
    display: block; width: 100%; text-align: left; margin-bottom: 6px;
    background: transparent; border: 1px solid transparent; color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  nav.side button:hover { background: var(--panel-2); }
  nav.side button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  nav.side .newdash {
    margin-top: 12px; border: 1px solid var(--border-2); background: var(--panel-2);
  }
  nav.side .note { color: var(--text-3); font-size: 12px; margin-top: 10px; }
  main { flex: 1; min-width: 0; padding: 20px; }
  .pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 24px; line-height: 30px; margin: 0; font-weight: 600; }
  h2 { font-size: 18px; line-height: 24px; margin: 22px 0 10px; font-weight: 600; }
  h3 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--text-2); margin-top: 4px; }
  .titlerow { display: flex; align-items: center; gap: 8px; }
  .infobtn {
    width: 22px; height: 22px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text);
    font-size: 12px; font-style: italic; font-weight: 700; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; font-family: Georgia, serif;
  }
  .infobtn:hover { border-color: var(--accent); color: var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit;

  .grid { display: grid; gap: 12px; }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 760px) {
    .shell { display: block; }
    nav.side { width: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .g4, .g3, .g2 { grid-template-columns: minmax(0, 1fr); }
  }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .card > .head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-2);
  }
  .card > .body { padding: 12px; }
  .tile .value { font-size: 22px; font-weight: 600; line-height: 28px; }
  .tile .label { color: var(--text-2); font-size: 12px; }
  .tile .note { color: var(--text-3); font-size: 12px; margin-top: 6px; }
  .v-good { color: var(--good); }
  .v-watch { color: var(--watch); }
  .v-poor { color: var(--poor); }
  .rag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-2); font-weight: 600; font-size: 12px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: rgba(127,127,127,0.05); }
  .cap { color: var(--text-3); font-size: 12px; margin-top: 8px; }
  .scope { color: var(--text-2); font-size: 12px; margin: 0 0 10px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .legend span.k { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-scrim.open { display: flex; }
  .modal {
    width: 100%; max-width: 920px; max-height: 84vh; overflow-y: auto;
    background: var(--chrome); border: 1px solid var(--border-2);
    border-radius: 10px; padding: 18px;
  }
  .modal .mhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .modal h2 { margin: 0; }
  .closebtn {
    background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .ragkey { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0 12px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  svg { display: block; width: 100%; height: auto; }
  .footer { color: var(--text-3); font-size: 12px; margin-top: 24px; }
</style>

/* ---------------------------- helpers ---------------------------- */
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function ragBadge(key) {
  const r = RAG[key];
  return '<span class="rag" style="color:' + r.color + '"><span class="dot" style="background:' + r.color + '"></span>' + r.label + '</span>';
}

function tile(value, label, note, rag) {
  const r = RAG[rag];
  return '<div class="card tile"><div class="body">' +
    '<div class="value ' + r.cls + '">' + esc(value) + '</div>' +
    '<div class="label">' + esc(label) + '</div>' +
    '<div style="margin-top:6px">' + ragBadge(rag) + '</div>' +
    '<div class="note">' + esc(note) + '</div>' +
    '</div></div>';
}

function plainTile(value, label, note) {
  return '<div class="card tile"><div class="body">' +
    '<div class="value">' + esc(value) + '</div>' +
    '<div class="label">' + esc(label) + '</div>' +
    '<div class="note">' + esc(note) + '</div>' +
    '</div></div>';
}

function table(headers, rows) {
  let h = '<table><thead><tr>' + headers.map(x => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>';
  h += rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('');
  return h + '</tbody></table>';
}

function card(title, trailing, body) {
  const head = title
    ? '<div class="head"><span>' + esc(title) + '</span>' + (trailing ? '<span>' + esc(trailing) + '</span>' : '') + '</div>'
    : '';
  return '<div class="card">' + head + '<div class="body">' + body + '</div></div>';
}

function legend(series) {
  return '<div class="legend">' + series.map(s =>
    '<span class="k"><span class="swatch" style="background:' + s.color + '"></span>' + esc(s.name) + '</span>').join('') + '</div>';
}

function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / mag * 2) / 2 * mag;
}

function barChart(categories, series, caption) {
  const W = 620, H = 230, padL = 44, padR = 12, padT = 12, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = niceMax(Math.max.apply(null, series.flatMap(s => s.data)));
  const groupW = plotW / categories.length;
  const barW = (groupW * 0.68) / series.length;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  for (let i = 0; i <= 4; i++) {
    const y = padT + plotH - (plotH * i / 4);
    const val = (max * i / 4);
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="var(--border)" stroke-width="1"/>';
    svg += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" font-size="10" fill="var(--text-3)" text-anchor="end">' + (Math.round(val * 100) / 100) + '</text>';
  }
  categories.forEach((cat, ci) => {
    const gx = padL + groupW * ci;
    series.forEach((s, si) => {
      const v = s.data[ci] || 0;
      const h = max === 0 ? 0 : (v / max) * plotH;
      const x = gx + groupW * 0.16 + barW * si;
      const y = padT + plotH - h;
      svg += '<rect x="' + x + '" y="' + y + '" width="' + Math.max(barW - 2, 1) + '" height="' + Math.max(h, 0) + '" fill="' + s.color + '" rx="2"><title>' + esc(s.name + ": " + v) + '</title></rect>';
    });
    svg += '<text x="' + (gx + groupW / 2) + '" y="' + (H - padB + 16) + '" font-size="10" fill="var(--text-2)" text-anchor="middle">' + esc(cat) + '</text>';
  });
  svg += '</svg>';
  return legend(series) + svg + (caption ? '<div class="cap">' + esc(caption) + '</div>' : '');
}

function lineChart(categories, series, caption, suffix) {
  const W = 620, H = 230, padL = 44, padR = 12, padT = 12, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = niceMax(Math.max.apply(null, series.flatMap(s => s.data)));
  const step = categories.length > 1 ? plotW / (categories.length - 1) : 0;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  for (let i = 0; i <= 4; i++) {
    const y = padT + plotH - (plotH * i / 4);
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="var(--border)" stroke-width="1"/>';
    svg += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" font-size="10" fill="var(--text-3)" text-anchor="end">' + (Math.round(max * i / 4 * 100) / 100) + '</text>';
  }
  series.forEach(s => {
    const pts = s.data.map((v, i) => [padL + step * i, padT + plotH - (max === 0 ? 0 : (v / max) * plotH)]);
    svg += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2" points="' + pts.map(p => p[0] + ',' + p[1]).join(' ') + '"/>';
    pts.forEach((p, i) => {
      svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="' + s.color + '"><title>' + esc(s.name + ": " + s.data[i] + (suffix || "")) + '</title></circle>';
    });
  });
  categories.forEach((c, i) => {
    svg += '<text x="' + (padL + step * i) + '" y="' + (H - padB + 16) + '" font-size="10" fill="var(--text-2)" text-anchor="middle">' + esc(c) + '</text>';
  });
  svg += '</svg>';
  return legend(series) + svg + (caption ? '<div class="cap">' + esc(caption) + '</div>' : '');
}

  h += '<div style="margin-top:12px">' + card("Priority mix and cycle time", "Where the defect pressure is",
    barChart(t.maint.priority.labels, [
      { name: "Resolved", data: t.maint.priority.count, color: "var(--info)" },
      { name: "Avg cycle time (days)", data: t.maint.priority.cycle, color: "var(--poor)" }
    ], "Source: Jira MAINT issues · x-axis priority, y-axis resolved count and mean cycle time (days)")) + '</div>';

  h += '<h2>Pull requests</h2><div class="scope">' + esc(t.prs.scope) + '</div><div class="grid g4">' +
    plainTile(t.prs.q2median, "Q2 median cycle time", t.prs.q2sub) +
    tile(t.prs.q3median, "Q3 median cycle time", t.prs.q3sub, "good") +
    tile(t.prs.small, "Share under 500 LOC", t.prs.smallSub, t.prs.smallRag) +
    tile(t.prs.huge, "Huge PRs, 1000 LOC and above", t.prs.hugeSub, t.prs.hugeRag) +
    '</div>';

  h += '<div class="grid g2" style="margin-top:12px">' +
    card("Cycle time by PR size", null, barChart(t.prs.buckets.labels, [
      { name: "Median cycle time (days)", data: t.prs.buckets.cycle, color: "var(--watch)" }
    ], "Source: LinearB · x-axis changed lines, y-axis median cycle time (days)")) +
    card("Two-week merge throughput", null, lineChart(t.prs.trend.periods, [
      { name: "PRs merged", data: t.prs.trend.merged, color: "var(--info)" }
    ], "Source: LinearB · x-axis two-week period start, y-axis PRs merged (count)")) +
    '</div>';

  h += '<div style="margin-top:12px">' + card("Reading this dashboard", null,
    '<div class="scope">These are flow indicators: pace, size and defect pressure. Use them to spot bottlenecks and batching problems. They do not describe release evidence, and a green row here does not mean a feature is ready to ship.</div>') + '</div>';

  return h;
}

function renderPr() {
  const proj = PROJECTS.find(p => p.value === state.project).label;
  let h = pageHead("PR flow", "Your dashboard · " + proj + " · GitHub, CI and SonarQube plugins", false);
  h += '<div class="grid g3">' +
    tile("6.2h", "Median PR cycle time", "target under 8h", "good") +
    tile("81%", "PRs under 500 LOC", "target 80%", "good") +
    tile("9", "Reviews waiting over 24h", "oldest 6 days", "poor") +
    '</div>';
  h += '<div style="margin-top:12px">' + card("Panel signals", null,
    table(["Signal","Now","Status","Context"], PR_ROWS.map(r => [esc(r.name), esc(r.value), ragBadge(r.rag), esc(r.note)]))) + '</div>';
  h += '<div style="margin-top:12px">' + card("Plugin bindings", null,
    table(["Panel","Plugin","Query"], [
      ["Merge latency","GitHub","repo scope · merged last 14d"],
      ["Required checks","CI","workflow:pr-verify"],
      ["Coverage delta","SonarQube","changed files only"]
    ].map(r => r.map(esc)))) + '</div>';
  return h;
}

function renderBuild() {
  let h = pageHead("Build plugins", "Your dashboard · panels composed from installed plugins", false);
  h += '<div class="grid g3">' +
    tile("96.4%", "CI pass rate", "branch main, 7 days", "good") +
    tile("11m", "p95 pipeline duration", "target under 10m", "watch") +
    tile("3", "High vulnerabilities", "all acknowledged", "watch") +
    '</div>';
  h += '<div style="margin-top:12px">' + card("Panel signals", null,
    table(["Signal","Now","Status","Context"], BUILD_ROWS.map(r => [esc(r.name), esc(r.value), ragBadge(r.rag), esc(r.note)]))) + '</div>';
  h += '<div class="grid g2" style="margin-top:12px">' +
    card("Installed plugins", null,
      '<div class="pills"><span class="chip">GitHub Actions</span><span class="chip">SonarQube</span><span class="chip">Xray</span><span class="chip">Dependency scanner</span></div>' +
      '<div class="cap">Add a panel, bind a plugin query, then save the board to your account.</div>') +
    card("Status rules on this board", null,
      '<h3>Pass rate</h3><div class="scope">Good at or above 95%, watch 90 to 95%, needs attention below 90%.</div>' +
      '<h3>Connector freshness</h3><div class="scope">Stale beyond 30 minutes renders as needs attention rather than green.</div>') +
    '</div>';
  return h;
}

/* ---------------------------- modal ---------------------------- */
function openGuide() {
  const g = GUIDES[state.nav];
  const rows = g.rows.map(r => r.map(esc));
  document.getElementById("modal").innerHTML =
    '<div class="mhead"><div><h2>' + esc(g.title) + '</h2>' +
    '<div class="sub">What each metric is for, where it comes from, and how it is calculated.</div></div>' +
    '<button class="closebtn" id="closeGuide">Close</button></div>' +
    '<div class="ragkey">' + ragBadge("good") + ragBadge("watch") + ragBadge("poor") + '</div><hr/>' +
    table(["Metric","Why it is useful","Where it comes from","Formula"], rows);
  document.getElementById("scrim").classList.add("open");
  document.getElementById("closeGuide").onclick = closeGuide;
}
function closeGuide() { document.getElementById("scrim").classList.remove("open"); }

document.getElementById("scrim").addEventListener("click", (e) => {
  if (e.target.id === "scrim") closeGuide();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeGuide(); });

/* ---------------------------- render ---------------------------- */
function render() {
  const main = document.getElementById("main");
  main.innerHTML =
    state.nav === "home" ? renderHome() :
    state.nav === "team" ? renderTeam() :
    state.nav === "pr" ? renderPr() : renderBuild();

  document.querySelectorAll("nav.side button[data-nav]").forEach(b => {
    b.classList.toggle("active", b.dataset.nav === state.nav);
  });

  const info = document.getElementById("infoBtn");
  if (info) info.onclick = openGuide;

  const sp = document.getElementById("selProject");
  if (sp) sp.onchange = (e) => { state.project = e.target.value; render(); };
  const sr = document.getElementById("selRelease");
  if (sr) sr.onchange = (e) => { state.release = e.target.value; render(); };
}

document.querySelectorAll("nav.side button[data-nav]").forEach(b => {
  b.onclick = () => { state.nav = b.dataset.nav; render(); };
});

render();
</script>
</body>
</html>
